name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master, "experimental/**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install host tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu bison flex gettext || true
          /opt/homebrew/bin/python3 -m pip install --break-system-packages --user pyyaml mako packaging
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/sources
            third_party/gpu
            build/ios-arm64/sysroot
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_ios.sh', 'scripts/build_angle_ios.sh', 'scripts/build_gpu_ios.sh', 'patches/*') }}

      - name: Build IPA
        run: ./scripts/ci_build.sh "$PWD/build/Husk.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: build/Husk.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
